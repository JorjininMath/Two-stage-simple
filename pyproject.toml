[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckme-two-stage"
version = "0.1.0"
description = "Two-stage conditional kernel mean embedding and conformal prediction research code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyDOE2>=1.3",
    "tqdm>=4.65",
]
test = [
    "pytest>=7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["CKME*", "CP*", "Two_stage*", "project_support*"]
