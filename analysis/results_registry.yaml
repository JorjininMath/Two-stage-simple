  - id: "mm1_input_uncertainty_feasibility"
    classification: "supporting_or_pilot"
    evidence_date: "2026-06-15"
    date_basis: "artifact modification timestamp"
    paper_role: "separate KME/CKME feasibility"
    protocol_aligned: false
    final_claim_eligible: false
    source_paths:
      - "experiments/mm1_feasibility/README.md"
      - "experiments/mm1_feasibility/results/smoke_kme_feas_summary.csv"
    verified_observations:
      - "The available summary is a two-seed smoke feasibility result."
      - "The module evaluates CDF and quantile error, not conformal coverage."
    limitations:
      - "Out of scope for CKME-DCP coverage claims."

  - id: "adaptive_h_final_sample_sd_nw"
    classification: "missing_refresh"
    evidence_date: null
    paper_role: "critical main-paper implementable-method evidence"
    protocol_aligned: null
    final_claim_eligible: false
    expected_paths:
      - "experiments/adaptive_h/output_final_adaptive_h/manifest.json"
      - "experiments/adaptive_h/output_final_adaptive_h/per_arm.csv"
      - "experiments/adaptive_h/output_final_adaptive_h/paired_deltas.csv"
      - "experiments/adaptive_h/output_final_adaptive_h/summary.csv"
      - "experiments/adaptive_h/output_final_adaptive_h/per_point/"
    acceptance_requirements:
      - "Estimator is per-site sample SD plus Nadaraya-Watson smoothing; no IQR response-scale arm."
      - "iid target-law calibration with one response per calibration input."
      - "At least 50 macroreplications."
      - "Final DGPs and budgets match experiments/adaptive_h/final_benchmark_spec.md."
      - "Manifest records seeds, settings, pretrained parameters, selected bw_factor, and source revision."
      - "Per-point data include raw_score, s_oracle, s_hat, h_over_s, and group_bin."

excluded_current_evidence:
  - pattern: "_archive/01_experiments/diagnostics/adaptive_h_iqr_response_scale/**"
    reason: "Retired IQR-based response-scale plug-in. Provenance only."
  - pattern: "experiments/adaptive_h/output_exp4/**"
    reason: "Pre-lock sample-SD/NW output without the final manifest and required diagnostics."
